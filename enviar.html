<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviando asistencia...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #202124;
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            display: none;
            color: #d93025;
            background: #fce8e6;
            padding: 16px 20px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.4;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="loader"></div>
        <p style="font-size: 15px; font-weight: 500;">Enviando asistencia a Google Forms...</p>
    </div>

    <div id="errorBox" class="error">
        ⚠️ <b>Faltan parámetros en la URL</b><br>
        Asegúrate de generar el enlace completo desde el panel principal.
    </div>

    <form id="autoForm" method="POST">
        <!-- Los campos se inyectan en milisegundos con JavaScript -->
    </form>

    <script>
        const params = new URLSearchParams(window.location.search);
        const formId = params.get('formId');

        if (!formId) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errorBox').style.display = 'block';
        } else {
            const form = document.getElementById('autoForm');
            form.action = `https://docs.google.com/forms/d/e/${formId}/formResponse`;

            // Mapeo exacto de las claves entry rescatadas de Google Forms
            const entries = {
                'entry.1125415197': params.get('nombre'),
                'entry.2038342567': params.get('rut'),
                'entry.1613874889': params.get('tutor'),
                'entry.1070242386': params.get('unidad'),
                'entry.252623464': params.get('tipo') ? params.get('tipo').toUpperCase() : 'ENTRADA',
                'entry.408381012': params.get('centro'),
                'entry.1147142850': params.get('carrera'),
                'entry.1058267936': params.get('practica')
            };

            for (const [key, value] of Object.entries(entries)) {
                if (value !== null) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = value;
                    form.appendChild(input);
                }
            }

            // Despacho del POST directo al procesador de Google Forms
            form.submit();
        }
    </script>
</body>
</html>
